# Configuration for one-step-off-policy TaskSync training (Megatron + GRPO).
#
# Inherits the base TaskSync megatron config and layers on the one-step-off
# specifics (rollout pool, hybrid_engine=False, rollout_correction).

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_megatron_trainer
  - _self_

# Mirrors data block from tasksync_grpo_megatron.yaml — placeholders to satisfy
# schema; trainer bypasses create_rl_dataset.
data:
  train_files: null
  val_files: null
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 5600
  max_response_length: 25600
  train_batch_size: 1
  val_batch_size: 1
  return_raw_chat: true
  return_raw_input_ids: false
  return_full_prompt: false
  shuffle: false
  dataloader_num_workers: 0
  filter_overlong_prompts: false
  truncation: error
  trust_remote_code: false

# Rollout resource pool (separate from trainer pool).
# Defaults: 16 GPU rollout = 2 nodes x 8 GPUs (matches train_megatron_one_step_off.sh).
rollout:
  nnodes: 2
  n_gpus_per_node: 8

actor_rollout_ref:
  # MUST be False for resource separation. Forced by the entry script as well.
  hybrid_engine: false

  env:
    tasks_dir: ???
    batch_size: 8
    group_size: 32
    filter_pattern: null
    data_py_timeout: 120
    validate_on_discovery: false
    ptc_timeout: 5
    max_tool_calls: 50
    max_turns: 30
    reward_type: dense
    ptc_mode: ptc
    ptc_error_penalty: 0.0
    val_ratio: 0.0

  dump_experience_every: -1

  model:
    path: /share/project/huggingface/models/Qwen3-Coder-30B-A3B-Instruct

  rollout:
    name: vllm
    mode: async

    prompt_length: 5600
    response_length: 25600
    max_model_len: 31200

    max_num_seqs: 256
    enable_chunked_prefill: true
    enforce_eager: false
    gpu_memory_utilization: 0.85

    n: 1
    temperature: 1.0

    # Both required for the one-step-off path:
    #   free_cache_engine=False keeps the rollout engine alive across steps so
    #     NCCL weight sync can broadcast into a live process.
    #   calculate_log_probs=true emits rollout_log_probs which the actor's
    #     bypass-mode loss reads as old_log_probs.
    free_cache_engine: false
    calculate_log_probs: true

    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 31200

    agent:
      default_agent_loop: tasksync_agent
      num_workers: 8

    # NCCL is required for fast actor->rollout weight sync across the
    # separated pools.
    checkpoint_engine:
      backend: nccl

  actor:
    loss_agg_mode: token-mean
    entropy_coeff: 0
    ppo_epochs: 2
    ppo_micro_batch_size_per_gpu: 2
    # Read by core_algos when bypass_mode loss is active.
    use_rollout_log_probs: true

algorithm:
  adv_estimator: grpo
  gamma: 1.0
  lam: 1.0
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

  # filter_groups intentionally not supported in this trainer (one-step-off
  # would degenerate to k-step-off if filtering re-rolled within a step).
  filter_groups:
    enable: false
    metric: acc
    max_num_gen_batches: 10

  # One-step-off correction. With bypass_mode=true, the actor's loss_mode is
  # overridden to "bypass_mode" (PPO-clip with IS) regardless of what the shell
  # passes for --loss_mode. Set bypass_mode=false to keep your loss (e.g. gspo)
  # intact and use IS-weight-only correction (decoupled mode).
  rollout_correction:
    bypass_mode: true
    loss_type: ppo_clip

trainer:
  project_name: gem-tasksync-training-verl
  experiment_name: tasksync_megatron_one_step_off
  logger: ["console", "wandb"]
  total_epochs: 2
  save_freq: 50
  test_freq: -1
  # Trainer (actor) pool. Defaults: 32 GPU = 4 nodes x 8 GPUs.
  n_gpus_per_node: 8
  nnodes: 4
  resume_mode: auto
  val_before_train: false
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  balance_batch: true
  dense_epoch: 0

reward:
  reward_model:
    enable: false
    enable_resource_pool: false
