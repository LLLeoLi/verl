# Configuration for training on task-sync environments with GRPO + Megatron backend.
#
# task-sync envs have: data.py + env.py + prompt.md (+ task_verification.py)
# Database is SQLite, generated by running data.py.
#
# We override the RayPPOTrainer dataloader entirely (see TaskSyncTrainer),
# so the data.* block here only needs to satisfy config schema defaults.

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_megatron_trainer
  - _self_

data:
  # Placeholder — our trainer bypasses create_rl_dataset.
  train_files: null
  val_files: null
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 5600
  max_response_length: 25600
  train_batch_size: 1
  val_batch_size: 1
  return_raw_chat: true
  return_raw_input_ids: false
  return_full_prompt: false
  shuffle: false
  dataloader_num_workers: 0
  filter_overlong_prompts: false
  truncation: error
  trust_remote_code: false

actor_rollout_ref:
  hybrid_engine: true

  # Task-sync specific options — consumed by TaskSyncAgentLoop + TaskSyncTrainer.
  env:
    tasks_dir: ???
    batch_size: 8
    group_size: 32
    filter_pattern: null
    data_py_timeout: 120
    validate_on_discovery: false
    ptc_timeout: 5
    max_tool_calls: 50
    max_turns: 30
    reward_type: dense      # "dense" or "binary"
    # ptc_mode: "ptc" -> all rollouts have programmatic_tool_call;
    #           "no-ptc" -> none do;
    #           "mixed" -> each task contributes both PTC and no-PTC groups
    #                     (effective batch doubles; ppo_mini_batch_size auto-doubled).
    ptc_mode: ptc
    val_ratio: 0.0          # 0 disables validation; e.g. 0.05 holds out 5% of tasks

  # Custom: how often to dump per-episode experiences (JSON). -1 disables.
  # Matches 0.7.0 safe default: disabled unless shell / CLI opts in.
  dump_experience_every: -1

  model:
    path: /share/project/huggingface/models/Qwen3-Coder-30B-A3B-Instruct

  rollout:
    name: vllm
    mode: async

    prompt_length: 5600
    response_length: 25600
    max_model_len: 31200

    max_num_seqs: 256
    enable_chunked_prefill: true
    enforce_eager: false
    gpu_memory_utilization: 0.6

    n: 1
    temperature: 1.0
    calculate_log_probs: true

    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 31200

    agent:
      default_agent_loop: tasksync_agent
      num_workers: 8

  actor:
    loss_agg_mode: token-mean
    entropy_coeff: 0
    ppo_epochs: 2
    ppo_micro_batch_size_per_gpu: 2
    use_rollout_log_probs: false

algorithm:
  adv_estimator: grpo
  gamma: 1.0
  lam: 1.0
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

  filter_groups:
    enable: false
    metric: acc
    max_num_gen_batches: 10

trainer:
  project_name: gem-tasksync-training-verl
  experiment_name: tasksync_megatron
  logger: ["console", "wandb"]
  total_epochs: 2
  save_freq: 50
  test_freq: -1
  n_gpus_per_node: 8
  nnodes: 2
  resume_mode: auto
  val_before_train: false
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}

  # Custom: switch reward from dense -> binary after N epochs. 0 disables.
  dense_epoch: 0

reward:
  reward_model:
    enable: false
    enable_resource_pool: false
